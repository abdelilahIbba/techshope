memory_limit=512M
upload_max_filesize=64M
post_max_size=64M
max_execution_time=120

; ─────────────────────────────────────────────────────────────────────────────
; OPcache — the single most impactful setting for Docker on Windows.
;
; Without OPcache every PHP-FPM request re-reads and re-parses thousands of
; Laravel/Composer files from the bind-mounted Windows filesystem (WSL2 bridge).
; That is 10-100× slower than native disk access, which is why the app was
; fast with `php artisan serve` (native NTFS) but slow inside Docker.
;
; With OPcache, compiled bytecode is stored in shared memory on the first
; request. All subsequent requests load from RAM — zero disk I/O for PHP files.
; ─────────────────────────────────────────────────────────────────────────────
[opcache]
opcache.enable                 = 1
opcache.enable_cli             = 0
opcache.memory_consumption     = 128
opcache.interned_strings_buffer= 16
opcache.max_accelerated_files  = 10000
; Recheck timestamps every 2 s so live code edits are picked up quickly.
opcache.validate_timestamps    = 1
opcache.revalidate_freq        = 2
; JIT (tracing mode) gives an additional 10-20 % speedup on PHP 8.
opcache.jit                    = tracing
opcache.jit_buffer_size        = 64M
