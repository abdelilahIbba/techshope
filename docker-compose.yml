services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: droguerie_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-droguerie_s}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - droguerie

  web:
    image: nginx:1.27-alpine
    container_name: droguerie_web
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - droguerie

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: droguerie_queue
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=1", "--verbose"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-droguerie_s}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    restart: unless-stopped
    networks:
      - droguerie

  db:
    image: postgres:16-alpine
    container_name: droguerie_db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-droguerie_s}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-droguerie_s}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - droguerie

  vite:
    image: node:22-alpine
    container_name: droguerie_vite
    profiles: ["frontend"]
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
    networks:
      - droguerie

networks:
  droguerie:
    driver: bridge

volumes:
  postgres_data:
