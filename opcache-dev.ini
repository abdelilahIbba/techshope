; Drop this file in the project root and start the dev server with:
;   php -c opcache-dev.ini artisan serve
;
; OPcache dramatically reduces startup time (2 min → ~2 s) by caching compiled
; PHP bytecode across requests instead of re-parsing all vendor files every time.
; Without this, php artisan serve re-parses ~8,000 vendor PHP files on every request.

zend_extension=opcache

[opcache]
opcache.enable=1
opcache.enable_cli=1

; Cache up to 10,000 PHP files (covers all of Laravel vendor/)
opcache.max_accelerated_files=10000

; 128 MB shared memory for bytecode cache
opcache.memory_consumption=128

; 8 MB for interned strings
opcache.interned_strings_buffer=8

; In development: revalidate every 2 seconds so changes are picked up quickly.
; Set to 0 in production for maximum speed (requires php-fpm reload on deploy).
opcache.revalidate_freq=2

; Validate file timestamps so edits are reflected without a server restart.
opcache.validate_timestamps=1
