services:
  techshope_app_v2:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: techshope_app_v2
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      # Anonymous/named volumes shadow the slow Windows bind mount for
      # directories that don't need to be edited from the host. This keeps
      # vendor/, node_modules/, and Laravel's runtime cache dirs on the fast
      # native Linux VM filesystem instead of the 9p/drvfs bridge to C:\.
      - techshope_vendor_v2:/var/www/html/vendor
      - techshope_bootstrap_cache_v2:/var/www/html/bootstrap/cache
      - techshope_storage_framework_v2:/var/www/html/storage/framework
      - techshope_storage_logs_v2:/var/www/html/storage/logs
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: techshope_pgsql_v2
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-droguerie_s}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      techshope_pgsql_v2:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - techshope_net_v2

  techshope_web_v2:
    image: nginx:1.27-alpine
    container_name: techshope_web_v2
    depends_on:
      - techshope_app_v2
    ports:
      - "18080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - techshope_net_v2

  techshope_queue_v2:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: techshope_queue_v2
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=1", "--verbose"]
    depends_on:
      techshope_pgsql_v2:
        condition: service_healthy
      techshope_app_v2:
        condition: service_started
    volumes:
      - ./:/var/www/html
      - techshope_vendor_v2:/var/www/html/vendor
      - techshope_bootstrap_cache_v2:/var/www/html/bootstrap/cache
      - techshope_storage_framework_v2:/var/www/html/storage/framework
      - techshope_storage_logs_v2:/var/www/html/storage/logs
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: techshope_pgsql_v2
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-droguerie_s}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    restart: unless-stopped
    networks:
      - techshope_net_v2

  techshope_pgsql_v2:
    image: postgres:16-alpine
    container_name: techshope_pgsql_v2
    environment:
      POSTGRES_DB: ${DB_DATABASE:-droguerie_s}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - techshope_pgdata_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-droguerie_s}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - techshope_net_v2

  techshope_vite_v2:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: techshope_vite_v2
    profiles: ["frontend"]
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 15173"
    ports:
      - "15173:15173"
    volumes:
      - ./:/var/www/html
      # node_modules and Vite's dependency-optimization cache on native
      # volumes: npm installs and Vite's dep scans are also very slow over
      # the Windows bind mount (same 9p bottleneck as vendor/ for PHP).
      - techshope_node_modules_v2:/var/www/html/node_modules
      - techshope_vite_cache_v2:/var/www/html/node_modules/.vite
    depends_on:
      - techshope_app_v2
    networks:
      - techshope_net_v2

networks:
  techshope_net_v2:
    driver: bridge

volumes:
  techshope_pgdata_v2:
  techshope_vendor_v2:
  techshope_bootstrap_cache_v2:
  techshope_storage_framework_v2:
  techshope_storage_logs_v2:
  techshope_node_modules_v2:
  techshope_vite_cache_v2:
