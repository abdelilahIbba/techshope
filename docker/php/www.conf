[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data
; static PM: workers are always alive so OPcache stays fully warm.
; A POS kiosk rarely needs more than 3 concurrent PHP workers.
pm = static
pm.max_children = 3
request_terminate_timeout = 300
request_slowlog_timeout = 10s
slowlog = /var/log/php-fpm-slow.log
catch_workers_output = yes
