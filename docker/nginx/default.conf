server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|svg|webp|avif|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass techshope_app_v2:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Prevent 502 Bad Gateway from slow PHP-FPM responses.
        # 120 s covers legitimate long operations (reports, file uploads).
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout    120s;
        fastcgi_read_timeout    120s;

        # Allow Laravel exception and error pages to display in dev
        fastcgi_intercept_errors off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
