services:

  # ── PHP-FPM Application ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: techshope_sck_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      # Named volumes keep vendor/, bootstrap/cache, storage on the fast
      # native Linux VM filesystem (avoid slow 9p/drvfs over Windows bind-mount)
      - techshope_sck_vendor:/var/www/html/vendor
      - techshope_sck_bootstrap_cache:/var/www/html/bootstrap/cache
      - techshope_sck_storage_framework:/var/www/html/storage/framework
      - techshope_sck_storage_logs:/var/www/html/storage/logs
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: techshope_sck_pgsql
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-techshope_sck}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-true}
    depends_on:
      techshope_sck_pgsql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - techshope_sck_net

  # ── Nginx Web Server ───────────────────────────────────────────────────────
  techshope_sck_web:
    image: nginx:1.27-alpine
    container_name: techshope_sck_web
    depends_on:
      - app
    ports:
      - "18081:80"        # Host 18081 → avoid clash with old techshope (18080)
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - techshope_sck_net

  # ── Queue Worker ───────────────────────────────────────────────────────────
  techshope_sck_queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: techshope_sck_queue
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=1", "--verbose"]
    depends_on:
      techshope_sck_pgsql:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./:/var/www/html
      - techshope_sck_vendor:/var/www/html/vendor
      - techshope_sck_bootstrap_cache:/var/www/html/bootstrap/cache
      - techshope_sck_storage_framework:/var/www/html/storage/framework
      - techshope_sck_storage_logs:/var/www/html/storage/logs
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: techshope_sck_pgsql
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-techshope_sck}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    restart: unless-stopped
    networks:
      - techshope_sck_net

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  techshope_sck_pgsql:
    image: postgres:16-alpine
    container_name: techshope_sck_pgsql
    environment:
      POSTGRES_DB: ${DB_DATABASE:-techshope_sck}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-15433}:5432"   # Host 15433 → avoid clash with old techshope (15432)
    volumes:
      - techshope_sck_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-techshope_sck}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - techshope_sck_net

  # ── Vite Dev Server (optional — use profile: frontend) ────────────────────
  techshope_sck_vite:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: techshope_sck_vite
    profiles: ["frontend"]
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 15174"
    ports:
      - "15174:15174"     # Host 15174 → avoid clash with old techshope (15173)
    volumes:
      - ./:/var/www/html
      - techshope_sck_node_modules:/var/www/html/node_modules
      - techshope_sck_vite_cache:/var/www/html/node_modules/.vite
    depends_on:
      - app
    networks:
      - techshope_sck_net

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  techshope_sck_net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  techshope_sck_pgdata:
  techshope_sck_vendor:
  techshope_sck_bootstrap_cache:
  techshope_sck_storage_framework:
  techshope_sck_storage_logs:
  techshope_sck_node_modules:
  techshope_sck_vite_cache:
